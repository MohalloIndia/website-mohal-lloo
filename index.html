<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
<link rel="shortcut icon" href="favicon.ico" type="mohallo.png.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Website Under Construction</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      background: #ffffff;
      overflow: hidden;
    }

    .page {
      width: 100%;
      height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .construction-image {
      width: 100%;
      height: 100%;

      object-fit: contain;
      display: block;
    }
  </style>
</head>

<body>

  <main class="page">

    <img
      class="construction-image"
      src="construction-doodle.png"
      alt="Website under construction"
    >

  </main>

</body>
</html>
